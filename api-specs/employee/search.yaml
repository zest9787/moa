# 응답 샘플: samples/employee-search-response.json (예시 데이터, 실제 SAP 계약 미검증)
# 필드 설명 원본: samples/employee-field-descriptions.txt
# sapResponse.sample의 data 내부 객체에서 fields를 구성한다.
# OData 응답 DTO: description을 필드 뒤 // 주석으로 사용하며 @Schema는 붙이지 않는다.
# Web DTO: description이 있는 필드에만 @Schema(description = "...")를 적용한다.
# 타입은 샘플에서 추론하며 실제 SAP 계약은 미검증이다.
specVersion: "1.0"

feature:
  name: employee_attendance
  basePackage: net.lucid.moa.features.employee

api:
  name: listEmployees
  method: GET
  path: /api/v1/employees/attendances
  summary: 근태현황 목록 조회
  operation: READ_LIST

sap:
  odataVersion: V4
  servicePath: /sap/opu/odata4/example/employee/srvd/sap/employee/attendances/0001
  entitySet: Employees
  httpMethod: GET

  query:
    select:
      - ALL

    filters:
      - parameter: employeeName
        sapField: EmployeeName
        operator: contains
        optional: true

      - parameter: departmentCode
        sapField: DepartmentCode
        operator: eq
        optional: true

    orderBy:
      - field: EmployeeId
        direction: asc

    pagination:
      enabled: true
      pageParameter: page
      sizeParameter: size
      defaultPage: 1
      defaultSize: 20
      maxSize: 100
      count: true

webRequest:
  enabled: true
  dtoName: EmployeeSearchRequest
  binding: QUERY
  fields:
    - name: employeeName
      type: String
      required: false
      description: 사원명

    - name: departmentCode
      type: String
      required: false
      description: 부서 코드

    - name: page
      type: Integer
      description: 페이지 번호
      defaultValue: 1
      validation:
        min: 1

    - name: size
      type: Integer
      description: 페이지 크기
      defaultValue: 20
      validation:
        min: 1
        max: 100

sapRequest:
  enabled: false

sapResponse:
  dtoName: ODataEmployeeResponse
  sample:
    data:
      - EmployeeId: "222221c"
        EmployeeName: "홍길동"
        DepartmentCode: "X001"
        HireDate: "2023-01-01"
  description: |
    EmployeeID 사번[...]
    EmployeeName 이름[...]
    DepartmentCode 부서코드[...]
    HireDate 입사일자[...]
  collection: true
  collectionProperty: data
  countProperty: "@odata.count"
  nextLinkProperty: "@odata.nextLink"

tests:
  controller: true
  service: true
  repository: true
  converter: true
